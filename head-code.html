<!-- Smooth scrolling (Lenis). Also smooths the nav's section anchors and hash arrivals. -->
<script src="https://cdn.jsdelivr.net/gh/mattdetails/graphyte-site@v1.0.3/smooth-scroll.js" defer></script>

<style>
  /* Hero hex bloom: keep it bottom-right when the hero stacks (tablet and phone).
     The asset is drawn top-right for the desktop column, so flip it vertically here. */
  @media (max-width: 991px) {
    .section-edge .media-fill img.media {
      object-position: top right !important;
      transform: scaleY(-1);
    }
  }

  /* Stamp CTA: hex bloom inside the orange card that sits directly above the footer.
     The selector targets whichever section is immediately before the footer. */
  .page-section:has(+ #sc-footer-grouped-menu-horizontal-menu-left) .card {
    background-image: url("https://cdn.jsdelivr.net/gh/mattdetails/graphyte-site@v1.0.4/hex/out/footer-stamp.svg");
    background-size: cover;
    background-position: top right;
    background-repeat: no-repeat;
  }
  .page-section:has(+ #sc-footer-grouped-menu-horizontal-menu-left) .card .button {
    background: #1A1817;
    border-color: #1A1817;
    color: #F6EFE4;
  }
</style>
