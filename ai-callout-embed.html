<style>
  :root {
    /* Fallbacks; theme-sync.js replaces these with the live tokens. */
    --scheme1-background: #F7F5F3; --scheme1-text: #080707; --scheme1-accent: #FF5521;
    --font-family-body: "Manrope", system-ui, sans-serif; --text-regular-size: 1rem; --text-regular-line-height: 1.5;
    --text-weight: 400;
    --radius-large: 8px; --border-width: 1px; --container-large: 80rem; --page-padding: 2.5rem;
    --card-padding-large: 2rem; --spacing-2: .5rem; --spacing-3: .75rem; --spacing-5: 1.25rem;

    /* Roles: an accent-tinted banner on the hero's scheme (Scheme 1). */
    --ai-ground: var(--scheme1-background);
    --ai-accent: var(--scheme1-accent);
    --ai-fill: color-mix(in srgb, var(--ai-accent) 16%, var(--ai-ground));
    --ai-border: color-mix(in srgb, var(--ai-accent) 60%, var(--ai-ground));
    --ai-text: var(--scheme1-text);
  }
  html, body { margin: 0; padding: 0; background: var(--ai-ground); }
  * { box-sizing: border-box; }
  .ai { padding: var(--spacing-5) var(--page-padding) 0; font-family: var(--font-family-body); }
  .ai a {
    max-width: var(--container-large); margin: 0 auto; display: flex; align-items: center; justify-content: center;
    flex-wrap: wrap; gap: 0 var(--spacing-2); text-align: center;
    padding: var(--spacing-3) var(--card-padding-large); background: var(--ai-fill); color: var(--ai-text);
    border: var(--border-width) solid var(--ai-border); border-radius: var(--radius-large); text-decoration: none;
    font-size: var(--text-regular-size); line-height: var(--text-regular-line-height); font-weight: var(--text-weight);
    transition: border-color .15s ease, background-color .15s ease;
  }
  .ai a:hover { border-color: var(--ai-accent); }
  .ai strong { font-weight: 700; white-space: nowrap; }
  .ai .arrow { display: inline-block; width: 1rem; height: 1rem; margin-left: .25rem; vertical-align: -.15em; color: var(--ai-accent); transition: transform .2s ease; }
  .ai a:hover .arrow { transform: translateX(3px); }
</style>

<div class="ai">
  <a href="/contact">
    <span>Need help understanding how AI can help your business?</span>
    <strong>Let's chat!<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></strong>
  </a>
</div>

<script>
  (function () {
    var root = document.documentElement, box = document.querySelector('.ai');
    addEventListener('message', function (e) {
      var d = e.data; if (!d || d.type !== 'graphyte:theme') return;
      Object.keys(d.tokens || {}).forEach(function (k) { root.style.setProperty(k, d.tokens[k]); });
      (d.fonts || []).forEach(function (href) {
        if (document.querySelector('link[href="' + href + '"]')) return;
        var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; document.head.appendChild(l);
      });
      size();
    });
    try { parent.postMessage({ type: 'graphyte:theme-request' }, '*'); } catch (e) {}
    var base = '';
    try { base = new URL(document.referrer).origin + '/'; } catch (e) {}
    if (base) Array.prototype.forEach.call(document.querySelectorAll('a[href^="/"]'), function (a) { a.href = base + a.getAttribute('href').replace(/^\//, ''); });
    /* Links: Relume's embed sandbox can't navigate the page (it forces new tabs), so internal links are
       handed to theme-sync.js in the head, which navigates the page itself. If the head script isn't
       there (no theme ever arrived), links fall back to Relume's default behaviour. */
    var bridged = false;
    addEventListener('message', function (e) { if (e.data && e.data.type === 'graphyte:theme') bridged = true; });
    document.addEventListener('click', function (e) {
      if (!bridged || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
      var h = a.getAttribute('href');
      if (!(h.charAt(0) === '/' || (base && h.indexOf(base) === 0))) return;
      e.preventDefault();
      try { parent.postMessage({ type: 'graphyte:navigate', href: h }, '*'); } catch (err) {}
    });
    function size() { try { parent.postMessage({ type: 'relume-embed:size', height: Math.ceil(box.getBoundingClientRect().height) }, '*'); } catch (e) {} }
    size(); addEventListener('load', size); addEventListener('resize', size);
    if (window.ResizeObserver) new ResizeObserver(size).observe(box);
  })();
</script>
